<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ひらがな れんしゅう</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="container">
<section class="controls">
<header class="script-selector" aria-label="もじをえらぶ">
<button class="script-option active" data-script="hiragana" aria-pressed="true">ひらがな</button>
<button class="script-option" data-script="katakana" aria-pressed="false">カタカナ</button>
</header>
<p class="instruction">もじを おしてね！</p>
<nav class="tabs" aria-label="もじのしゅるい">
<button class="tab active" data-target="basic" data-hiragana-label="あいう" data-katakana-label="アイウ">あいう</button>
<button class="tab" data-target="dakuten" data-hiragana-label="゛゜" data-katakana-label="゛゜">゛゜</button>
<button class="tab" data-target="youon" data-hiragana-label="ゃゅょ" data-katakana-label="ャュョ">ゃゅょ</button>
</nav>
<div class="handedness" aria-label="ききて">
<span>ききて</span>
<div class="hand-options">
<button class="hand-option active" data-hand="right" aria-pressed="true">右</button>
<button class="hand-option" data-hand="left" aria-pressed="false">左</button>
</div>
</div>
<div id="result-mobile" class="result-mirror" aria-hidden="true">?</div>
</section>
<section class="practice">
<div id="basic" class="kana-chart panel active" aria-label="ひらがな五十音表">
<div class="kana-column"><button data-romaji="A">あ</button><button data-romaji="I">い</button><button data-romaji="U">う</button><button data-romaji="E">え</button><button data-romaji="O">お</button></div>
<div class="kana-column"><button data-romaji="KA">か</button><button data-romaji="KI">き</button><button data-romaji="KU">く</button><button data-romaji="KE">け</button><button data-romaji="KO">こ</button></div>
<div class="kana-column"><button data-romaji="SA">さ</button><button data-romaji="SHI">し</button><button data-romaji="SU">す</button><button data-romaji="SE">せ</button><button data-romaji="SO">そ</button></div>
<div class="kana-column"><button data-romaji="TA">た</button><button data-romaji="CHI">ち</button><button data-romaji="TSU">つ</button><button data-romaji="TE">て</button><button data-romaji="TO">と</button></div>
<div class="kana-column"><button data-romaji="NA">な</button><button data-romaji="NI">に</button><button data-romaji="NU">ぬ</button><button data-romaji="NE">ね</button><button data-romaji="NO">の</button></div>
<div class="kana-column"><button data-romaji="HA">は</button><button data-romaji="HI">ひ</button><button data-romaji="FU">ふ</button><button data-romaji="HE">へ</button><button data-romaji="HO">ほ</button></div>
<div class="kana-column"><button data-romaji="MA">ま</button><button data-romaji="MI">み</button><button data-romaji="MU">む</button><button data-romaji="ME">め</button><button data-romaji="MO">も</button></div>
<div class="kana-column"><button data-romaji="YA">や</button><span class="blank"></span><button data-romaji="YU">ゆ</button><span class="blank"></span><button data-romaji="YO">よ</button></div>
<div class="kana-column"><button data-romaji="RA">ら</button><button data-romaji="RI">り</button><button data-romaji="RU">る</button><button data-romaji="RE">れ</button><button data-romaji="RO">ろ</button></div>
<div class="kana-column"><button data-romaji="WA">わ</button><span class="blank"></span><button data-romaji="WO">を</button><span class="blank"></span><button data-romaji="N">ん</button></div>
</div>
<div id="dakuten" class="kana-chart panel" aria-label="ひらがな濁音と半濁音">
<div class="kana-column"><button data-romaji="GA">が</button><button data-romaji="GI">ぎ</button><button data-romaji="GU">ぐ</button><button data-romaji="GE">げ</button><button data-romaji="GO">ご</button></div>
<div class="kana-column"><button data-romaji="ZA">ざ</button><button data-romaji="JI">じ</button><button data-romaji="ZU">ず</button><button data-romaji="ZE">ぜ</button><button data-romaji="ZO">ぞ</button></div>
<div class="kana-column"><button data-romaji="DA">だ</button><button data-romaji="JI">ぢ</button><button data-romaji="ZU">づ</button><button data-romaji="DE">で</button><button data-romaji="DO">ど</button></div>
<div class="kana-column"><button data-romaji="BA">ば</button><button data-romaji="BI">び</button><button data-romaji="BU">ぶ</button><button data-romaji="BE">べ</button><button data-romaji="BO">ぼ</button></div>
<div class="kana-column"><button data-romaji="PA">ぱ</button><button data-romaji="PI">ぴ</button><button data-romaji="PU">ぷ</button><button data-romaji="PE">ぺ</button><button data-romaji="PO">ぽ</button></div>
</div>
<div id="youon" class="youon-chart panel" aria-label="ひらがな拗音">
<div class="youon-row"><button data-romaji="KYA">きゃ</button><button data-romaji="KYU">きゅ</button><button data-romaji="KYO">きょ</button></div>
<div class="youon-row"><button data-romaji="SHA">しゃ</button><button data-romaji="SHU">しゅ</button><button data-romaji="SHO">しょ</button></div>
<div class="youon-row"><button data-romaji="CHA">ちゃ</button><button data-romaji="CHU">ちゅ</button><button data-romaji="CHO">ちょ</button></div>
<div class="youon-row"><button data-romaji="NYA">にゃ</button><button data-romaji="NYU">にゅ</button><button data-romaji="NYO">にょ</button></div>
<div class="youon-row"><button data-romaji="HYA">ひゃ</button><button data-romaji="HYU">ひゅ</button><button data-romaji="HYO">ひょ</button></div>
<div class="youon-row"><button data-romaji="MYA">みゃ</button><button data-romaji="MYU">みゅ</button><button data-romaji="MYO">みょ</button></div>
<div class="youon-row"><button data-romaji="RYA">りゃ</button><button data-romaji="RYU">りゅ</button><button data-romaji="RYO">りょ</button></div>
<div class="youon-row"><button data-romaji="GYA">ぎゃ</button><button data-romaji="GYU">ぎゅ</button><button data-romaji="GYO">ぎょ</button></div>
<div class="youon-row"><button data-romaji="JA">じゃ</button><button data-romaji="JU">じゅ</button><button data-romaji="JO">じょ</button></div>
<div class="youon-row"><button data-romaji="BYA">びゃ</button><button data-romaji="BYU">びゅ</button><button data-romaji="BYO">びょ</button></div>
<div class="youon-row"><button data-romaji="PYA">ぴゃ</button><button data-romaji="PYU">ぴゅ</button><button data-romaji="PYO">ぴょ</button></div>
</div>

<div id="katakana-basic" class="kana-chart panel" aria-label="カタカナ五十音表">
<div class="kana-column"><button data-romaji="A">ア</button><button data-romaji="I">イ</button><button data-romaji="U">ウ</button><button data-romaji="E">エ</button><button data-romaji="O">オ</button></div>
<div class="kana-column"><button data-romaji="KA">カ</button><button data-romaji="KI">キ</button><button data-romaji="KU">ク</button><button data-romaji="KE">ケ</button><button data-romaji="KO">コ</button></div>
<div class="kana-column"><button data-romaji="SA">サ</button><button data-romaji="SHI">シ</button><button data-romaji="SU">ス</button><button data-romaji="SE">セ</button><button data-romaji="SO">ソ</button></div>
<div class="kana-column"><button data-romaji="TA">タ</button><button data-romaji="CHI">チ</button><button data-romaji="TSU">ツ</button><button data-romaji="TE">テ</button><button data-romaji="TO">ト</button></div>
<div class="kana-column"><button data-romaji="NA">ナ</button><button data-romaji="NI">ニ</button><button data-romaji="NU">ヌ</button><button data-romaji="NE">ネ</button><button data-romaji="NO">ノ</button></div>
<div class="kana-column"><button data-romaji="HA">ハ</button><button data-romaji="HI">ヒ</button><button data-romaji="FU">フ</button><button data-romaji="HE">ヘ</button><button data-romaji="HO">ホ</button></div>
<div class="kana-column"><button data-romaji="MA">マ</button><button data-romaji="MI">ミ</button><button data-romaji="MU">ム</button><button data-romaji="ME">メ</button><button data-romaji="MO">モ</button></div>
<div class="kana-column"><button data-romaji="YA">ヤ</button><span class="blank"></span><button data-romaji="YU">ユ</button><span class="blank"></span><button data-romaji="YO">ヨ</button></div>
<div class="kana-column"><button data-romaji="RA">ラ</button><button data-romaji="RI">リ</button><button data-romaji="RU">ル</button><button data-romaji="RE">レ</button><button data-romaji="RO">ロ</button></div>
<div class="kana-column"><button data-romaji="WA">ワ</button><span class="blank"></span><button data-romaji="WO">ヲ</button><span class="blank"></span><button data-romaji="N">ン</button></div>
</div>
<div id="katakana-dakuten" class="kana-chart panel" aria-label="カタカナ濁音と半濁音">
<div class="kana-column"><button data-romaji="GA">ガ</button><button data-romaji="GI">ギ</button><button data-romaji="GU">グ</button><button data-romaji="GE">ゲ</button><button data-romaji="GO">ゴ</button></div>
<div class="kana-column"><button data-romaji="ZA">ザ</button><button data-romaji="JI">ジ</button><button data-romaji="ZU">ズ</button><button data-romaji="ZE">ゼ</button><button data-romaji="ZO">ゾ</button></div>
<div class="kana-column"><button data-romaji="DA">ダ</button><button data-romaji="JI">ヂ</button><button data-romaji="ZU">ヅ</button><button data-romaji="DE">デ</button><button data-romaji="DO">ド</button></div>
<div class="kana-column"><button data-romaji="BA">バ</button><button data-romaji="BI">ビ</button><button data-romaji="BU">ブ</button><button data-romaji="BE">ベ</button><button data-romaji="BO">ボ</button></div>
<div class="kana-column"><button data-romaji="PA">パ</button><button data-romaji="PI">ピ</button><button data-romaji="PU">プ</button><button data-romaji="PE">ペ</button><button data-romaji="PO">ポ</button></div>
</div>
<div id="katakana-youon" class="youon-chart panel" aria-label="カタカナ拗音">
<div class="youon-row"><button data-romaji="KYA">キャ</button><button data-romaji="KYU">キュ</button><button data-romaji="KYO">キョ</button></div>
<div class="youon-row"><button data-romaji="SHA">シャ</button><button data-romaji="SHU">シュ</button><button data-romaji="SHO">ショ</button></div>
<div class="youon-row"><button data-romaji="CHA">チャ</button><button data-romaji="CHU">チュ</button><button data-romaji="CHO">チョ</button></div>
<div class="youon-row"><button data-romaji="NYA">ニャ</button><button data-romaji="NYU">ニュ</button><button data-romaji="NYO">ニョ</button></div>
<div class="youon-row"><button data-romaji="HYA">ヒャ</button><button data-romaji="HYU">ヒュ</button><button data-romaji="HYO">ヒョ</button></div>
<div class="youon-row"><button data-romaji="MYA">ミャ</button><button data-romaji="MYU">ミュ</button><button data-romaji="MYO">ミョ</button></div>
<div class="youon-row"><button data-romaji="RYA">リャ</button><button data-romaji="RYU">リュ</button><button data-romaji="RYO">リョ</button></div>
<div class="youon-row"><button data-romaji="GYA">ギャ</button><button data-romaji="GYU">ギュ</button><button data-romaji="GYO">ギョ</button></div>
<div class="youon-row"><button data-romaji="JA">ジャ</button><button data-romaji="JU">ジュ</button><button data-romaji="JO">ジョ</button></div>
<div class="youon-row"><button data-romaji="BYA">ビャ</button><button data-romaji="BYU">ビュ</button><button data-romaji="BYO">ビョ</button></div>
<div class="youon-row"><button data-romaji="PYA">ピャ</button><button data-romaji="PYU">ピュ</button><button data-romaji="PYO">ピョ</button></div>
</div>
<div id="result" aria-live="polite">?</div>
</section>
</main>
<script src="script.js"></script>
</body>
</html>
